<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jeff White Group — Back Shop Inventory</title>
<link rel="icon" type="image/jpeg" href="https://chambermaster.blob.core.windows.net/images/customers/2454/representatives/44776186/400x400/JEFF+WHITE+GROUP+-+GREEN+TREE+CIRCLE+JPEG_141157.jpg"/>
<link rel="apple-touch-icon" sizes="180x180" href="https://chambermaster.blob.core.windows.net/images/customers/2454/representatives/44776186/400x400/JEFF+WHITE+GROUP+-+GREEN+TREE+CIRCLE+JPEG_141157.jpg"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="JWG Inventory"/>
<meta name="theme-color" content="#057334"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- ─── LOGIN SCREEN ─────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-orb login-orb-1"></div>
  <div class="login-orb login-orb-2"></div>
  <div class="login-orb login-orb-3"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-ring-wrap">
        <div class="llr-outer"></div>
        <div class="llr-inner-ring"></div>
        <div class="llr-bg"></div>
        <div class="llr-img">
          <img src="https://chambermaster.blob.core.windows.net/images/customers/2454/representatives/44776186/400x400/JEFF+WHITE+GROUP+-+GREEN+TREE+CIRCLE+JPEG_141157.jpg"
            alt="JW"
            onerror="this.style.display='none';this.parentElement.style.background='#057334';this.parentElement.innerHTML+='<div style=\'display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-weight:900;font-size:22px;color:white\'>JW</div>'">
        </div>
      </div>
      <div class="login-brand">Jeff White Group</div>
      <div class="login-tagline">Back Shop Inventory</div>
    </div>
    <div class="login-form">
      <div class="login-field">
        <label class="login-label">Email</label>
        <input class="login-input" id="li-user" type="text" placeholder="Enter your username or email" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('li-pass').focus()">
      </div>
      <div class="login-field">
        <label class="login-label">Password</label>
        <input class="login-input" id="li-pass" type="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="login-error" id="li-err">Incorrect username or password.</div>
      <button class="login-btn" id="li-btn" onclick="doLogin()">Sign In</button>
    </div>
    <div class="login-footer">Jeff White Group © 2026 · Internal Use Only</div>
  </div>
</div>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div id="header">
  <div class="logo">
    <div class="logo-img-wrap">
      <div class="logo-img-ring"></div>
      <div class="logo-img-bg"></div>
      <div class="logo-img">
        <img src="https://chambermaster.blob.core.windows.net/images/customers/2454/representatives/44776186/400x400/JEFF+WHITE+GROUP+-+GREEN+TREE+CIRCLE+JPEG_141157.jpg" alt="Jeff White Group"
          onerror="this.parentElement.style.background='var(--accent-light)';this.style.display='none';this.parentElement.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-weight:800;font-size:15px;color:var(--accent)\'>JW</div>'">
      </div>
    </div>
    <div class="logo-words">
      <div class="logo-text">Jeff White Group</div>
      <div class="logo-sub">Back Shop Inventory</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
    <span id="user-badge" style="display:none;font-size:12px;font-weight:600;color:var(--fg-muted);background:var(--surface);border:1px solid var(--border-h);border-radius:20px;padding:5px 12px;"></span>
    <button class="logout-btn" onclick="doLogout()">Sign Out</button>
  </div>
</div>

<div id="toast"></div>

<!-- Session Timeout Warning -->
<div id="timeout-overlay">
  <div class="timeout-card">
    <span class="timeout-icon">⏳</span>
    <div class="timeout-title">Still there?</div>
    <div class="timeout-msg">You've been inactive for a while. For security, you'll be signed out soon.</div>
    <div class="timeout-countdown" id="timeout-countdown">5:00</div>
    <div class="timeout-actions">
      <button class="timeout-btn timeout-btn-primary" onclick="resetInactivityTimer()">I'm still here</button>
      <button class="timeout-btn timeout-btn-secondary" onclick="doLogout()">Sign out now</button>
    </div>
  </div>
</div>

<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">↑</button>

<!-- App content — the inventory page renders into .card -->
<div id="app" style="display:none">
  <div class="card"><div style="padding:20px;text-align:center;color:var(--fg-muted)">Loading…</div></div>
</div>

<!-- ─── JS MODULES (loaded in dependency order) ──────────────────────────────── -->
<script defer src="js/config.js"></script>
<script defer src="js/utils.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/inventory.js"></script>
<script defer src="js/realtime.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
